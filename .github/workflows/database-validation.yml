name: Database subsystem validation
on:
  # Explicit feedback/acceptance while release omissions remain unqualified.
  # Full product CI remains the required automatic coverage on pushes and PRs.
  workflow_dispatch:
    inputs:
      baseline:
        description: Annotated database release tag (database-vVERSION)
        required: true
        type: string
      scope:
        description: Select bounded feedback or the complete product gate
        type: choice
        default: auto
        options: [auto, workspace]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo/icydb
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/icydb
      CARGO_TERM_COLOR: always
      VALIDATION_LOG_DIR: ${{ github.workspace }}/target/database-validation/runs
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
      - name: Explain database selection
        env:
          BASELINE: ${{ inputs.baseline }}
          SCOPE: ${{ inputs.scope }}
        run: |
          mkdir -p target/database-validation
          perl scripts/ci/database-validation-plan.pl "$BASELINE" "$SCOPE" > target/database-validation/selection.json
          cat target/database-validation/selection.json
          {
            printf '### Database validation selection\n\n```json\n'
            cat target/database-validation/selection.json
            printf '\n```\n\nFull product CI and release gates remain independently required.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/prepare-rust
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Prepare declared native tools
        run: make install-dev
      - name: Save pinned tool downloads
        uses: ./.github/actions/cache-tool-downloads
        with:
          mode: save
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Run selected scope and cross-subsystem acceptance
        run: |
          target="$(jq -er .target target/database-validation/selection.json)"
          case "$target" in
            validate|ci-database-parser|ci-database-planner|ci-database-query) ;;
            *) exit 2 ;;
          esac
          make "$target"
      - name: Retain selection and stage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-validation-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            target/database-validation/
            target/validation-failures/
          if-no-files-found: error
          retention-days: 30
