name: SQL Tier C Native Evidence

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-tier-c-native-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo/icydb
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/icydb
  CARGO_TERM_COLOR: always
  RUST_CURRENT: "1.97.1"

jobs:
  shard:
    name: Native shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target/icydb
          cache-targets: "false"
      - run: cargo fetch --locked
      - name: Execute exact native Tier C shard
        run: make test-sql-tier-c-shard TIER_C_SHARD=${{ matrix.shard }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sql-tier-c-native-shard-${{ matrix.shard }}
          path: |
            artifacts/correctness/sql_tier_c/tier-c-shard-${{ matrix.shard }}.json
            artifacts/correctness/sql_tier_c/failures/
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Merge receipts and coverage
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target/icydb
          cache-targets: "false"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: sql-tier-c-native-shard-*
          path: artifacts/correctness/sql_tier_c
          merge-multiple: true
      - run: cargo fetch --locked
      - name: Merge all eight native receipts
        run: make test-sql-tier-c-merge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sql-tier-c-native-merged
          path: |
            artifacts/correctness/sql_tier_c/tier-c-merged.json
            artifacts/correctness/sql_tier_c/tier-c-distribution.json
          if-no-files-found: error
          retention-days: 14
