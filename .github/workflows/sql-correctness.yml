name: SQL Tier C Native Evidence

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo/icydb
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/icydb
  CARGO_TERM_COLOR: always
  RUST_CURRENT: "stable"

jobs:
  shard:
    name: Native shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target/icydb
          cache-targets: "false"
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Execute exact native Tier C shard
        run: make test-sql-tier-c-shard TIER_C_SHARD=${{ matrix.shard }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sql-tier-c-native-shard-${{ matrix.shard }}
          path: |
            artifacts/correctness/sql_tier_c/tier-c-shard-${{ matrix.shard }}.json
            artifacts/correctness/sql_tier_c/failures/
          if-no-files-found: error
          retention-days: 14

  merge:
    name: Merge receipts and coverage
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target/icydb
          cache-targets: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sql-tier-c-native-shard-*
          path: artifacts/correctness/sql_tier_c
          merge-multiple: true
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Merge all eight native receipts
        run: make test-sql-tier-c-merge
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sql-tier-c-native-merged
          path: |
            artifacts/correctness/sql_tier_c/tier-c-merged.json
            artifacts/correctness/sql_tier_c/tier-c-distribution.json
          if-no-files-found: error
          retention-days: 14
