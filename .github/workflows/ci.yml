name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer run replaces queued and running checks for this workflow and ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo/icydb
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/icydb
  CARGO_TERM_COLOR: always
  RUST_CURRENT: "stable"
  SCCACHE_GHA_ENABLED: "true"
  IC_TOOLS: icp ic-wasm wasm-opt

jobs:
  dependency_msrv:
    runs-on: ubuntu-24.04
    env:
      RUSTC_WRAPPER: sccache
      RUSTUP_TOOLCHAIN: "1.91.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
          cache-targets: "false"
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Check the declared public MSRV
        run: bash scripts/ci/check-public-msrv.sh
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ensure GitHub CLI
        run: make install-gh
      - name: Install actionlint
        run: |
          bin="$(bash scripts/ci/install-icydb-actionlint.sh)"
          echo "ACTIONLINT_BIN=$bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: rustfmt
      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl
      - name: Install pinned ShellCheck
        run: |
          source ci/tool-versions.env
          tool_dir="$RUNNER_TEMP/icydb-ci-tools"
          bash scripts/ci/install-ci-tool.sh shellcheck \
            --version "$SHARED_TOOLING_SHELLCHECK_VERSION" \
            --sha256 "$SHARED_TOOLING_SHELLCHECK_SHA256_LINUX_X86_64" \
            --install-dir "$tool_dir"
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Install pinned local tools
        run: |
          make install-tools LOCAL_TOOL_INSTALL_TARGETS= > "$RUNNER_TEMP/tools-install.log" 2>&1
          make tools-check LOCAL_TOOL_CHECK_TARGETS= > "$RUNNER_TEMP/tools-check.log" 2>&1
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Prepare locked Cargo release editor for fixtures
        run: |
          make install-release-editor
          make release-editor-check
      - name: Run static validation with complete feedback
        run: make ci-static
      - name: Retain tooling failure evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: tooling-static-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
          ic-tools: ${{ env.IC_TOOLS }}

  rust:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            make_target: ci-core
          - lane: workspace
            make_target: ci-workspace
          - lane: tier-a
            make_target: ci-sql-tier-a
    env:
      RUSTC_WRAPPER: sccache
      TMPDIR: ${{ github.workspace }}/.cache
      IC_TOOLS: wasm-opt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare temporary directory for toolchain installation
        run: mkdir -p "$TMPDIR"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install wasm target
        if: matrix.lane == 'workspace'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Restrict cache scanning to the real workspace root.
          # trybuild generates temporary Cargo.toml files under target/tests,
          # and scanning those can make the cache action probe missing paths
          # like target/tests/target in post-job cleanup.
          workspaces: |
            . -> target
          # Keep registry/git caching, but avoid unstable target-dir probing
          # from ephemeral trybuild workspaces under `target/tests`.
          cache-targets: "false"
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Install pinned local tools
        run: |
          make install-tools LOCAL_TOOL_INSTALL_TARGETS= > "$RUNNER_TEMP/tools-install.log" 2>&1
          make tools-check LOCAL_TOOL_CHECK_TARGETS= > "$RUNNER_TEMP/tools-check.log" 2>&1
          printf '%s\n' "$GITHUB_WORKSPACE/.tools/host/bin" \
            "$GITHUB_WORKSPACE/.tools/ic/bin" "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
      - name: Prepare governed IC tools for canister builds
        if: matrix.lane == 'workspace'
        run: |
          make install-ic-tools > "$RUNNER_TEMP/tools-ic-install.log" 2>&1
          make ic-tools-check > "$RUNNER_TEMP/tools-ic-check.log" 2>&1
      - name: Run ${{ matrix.lane }} validation with complete feedback
        env:
          MAKE_TARGET: ${{ matrix.make_target }}
        run: |
          make "$MAKE_TARGET"
      - name: Retain tooling failure evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: tooling-${{ matrix.lane }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
          ic-tools: ${{ env.IC_TOOLS }}
  macos_host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: ""
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Install native workstation prerequisites and tools
        run: make install-dev
      - name: Prepare locked Cargo release editor for fixtures
        run: |
          make release-editor-check
      - name: Expose installed tool directories
        run: |
          printf '%s\n' "$CARGO_HOME/bin" "$HOME/.local/bin" \
            "$GITHUB_WORKSPACE/.tools/host/bin" "$GITHUB_WORKSPACE/.tools/ic/bin" \
            "$GITHUB_WORKSPACE/.tools/rust/common/bin" >> "$GITHUB_PATH"
      - name: Qualify portable automation with system Bash
        run: |
          export PATH="/bin:/usr/bin:/usr/sbin:/sbin:$PATH"
          # Use the directory already collected by shared failure retention.
          # Anchor macOS's aliased temporary root before fixtures allocate paths.
          mkdir -p "$RUNNER_TEMP/portable-fixtures"
          TMPDIR="$(cd "$RUNNER_TEMP/portable-fixtures" && pwd -P)"
          export TMPDIR
          /bin/bash --version
          make check-portable-automation
          /bin/bash scripts/ci/test-tool-commands.sh
          make check-dependency-pins
          /bin/bash scripts/ci/test-wasm-audit-report.sh
          /bin/bash scripts/ci/verify-wasm-optimizer.sh
          make tools-check
          shellcheck -x --exclude=SC2001,SC2016 scripts/dev/workstation-setup.sh scripts/dev/install-host-tools.sh scripts/dev/install-ic-tools.sh scripts/ci/install-gh.sh scripts/ci/verify-wasm-optimizer.sh scripts/ci/wasm-report-common.sh scripts/ci/wasm-size-report.sh scripts/ci/wasm-audit-report.sh scripts/ci/test-workstation-setup.sh scripts/ci/test-wasm-audit-report.sh
      - name: Qualify native library and CLI builds
        run: |
          cargo clippy --locked -p icydb-testing-build --lib --bin write_wasm_size_report -- -D warnings
          cargo clippy --locked -p icydb-cli --bin icydb -- -D warnings
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --bin icydb icp::
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --bin icydb diagnostic::
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --bin icydb tests::observability::
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --bin icydb shell::render::tests::
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --test command_exit_status migration_
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --test command_exit_status canister_id
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --test command_exit_status malformed_inventory_cannot_fall_back_to_the_manifest
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --test command_exit_status inventory_preserves_empty_success_and_failed_command_fallback
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --test command_exit_status external_
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-cli --test command_exit_status mutation_capture_
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-testing-model-schema-only --lib renamed_schema_only_dependency_emits_fragment
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-testing-build --lib canister_artifact::tests
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-testing-build --lib wasm_optimizer::tests
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-testing-build --lib canister_build_cache::tests::post_link_batch_reports_failure_and_finishes_later_artifact
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-testing-build --bin write_wasm_size_report
          bash scripts/ci/run-nonempty-cargo-test.sh --locked -p icydb-core --lib --all-features db::integrity::tests::quick_
          make fmt-check
          icp --version
          ic-wasm --version
      - name: Retain tooling failure evidence
        if: failure()
        uses: ./.github/actions/retain-failure-evidence
        with:
          name: tooling-${{ matrix.os }}-${{ github.run_attempt }}
          temp-root: ${{ runner.temp }}
          repository-root: ${{ github.workspace }}
          compact-successful-tools: 'true'
          ic-tools: ${{ env.IC_TOOLS }}

  wire_browser:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      IC_TOOLS: wasm-opt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Prepare exact browser tooling
        run: |
          npm install --global npm@12.2.0 --ignore-scripts
          npm --prefix testing/wire-browser ci --ignore-scripts
      - name: Fetch locked workspace dependencies
        run: cargo fetch --locked
      - name: Lint native browser contract owner
        run: |
          cargo clippy --locked -p icydb-testing-build --example wire_bindings -- -D warnings
      - name: Check native and browser codec contracts
        run: make check-wire-browser
      - name: Retain browser qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wire-browser-${{ github.run_attempt }}
          path: |
            target/wire-browser/contracts.json
            target/wire-browser/vectors.mjs
          if-no-files-found: ignore

  # Preserve the existing required-check identity while the independent lanes
  # finish in parallel and report their own complete failure sets.
  check:
    if: always()
    needs: [static, rust, macos_host, wire_browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          MACOS_RESULT: ${{ needs.macos_host.result }}
          WIRE_BROWSER_RESULT: ${{ needs.wire_browser.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$MACOS_RESULT" = "success"
          test "$WIRE_BROWSER_RESULT" = "success"
