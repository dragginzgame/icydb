name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo/icydb
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/icydb
  CARGO_TERM_COLOR: always
  RUST_CURRENT: "1.99.0"
  RUST_MSRV: "1.88.0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  dependency_msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
          cache-targets: "false"
      - run: cargo fetch --locked
      - run: cargo check --locked -p icydb --no-default-features
      - run: cargo check --locked -p icydb --no-default-features --features sql
      - run: cargo check --locked -p icydb --no-default-features --features migration

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Ensure GitHub CLI
        run: make install-gh
      - name: Install actionlint
        run: |
          bin="$(bash scripts/ci/install-icydb-actionlint.sh)"
          echo "ACTIONLINT_BIN=$bin" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: rustfmt
      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y perl ripgrep shellcheck jq
      - name: Install pinned configuration parser
        run: bash scripts/ci/install-icydb-yq.sh
      - name: Install pinned formatting tools
        run: |
          source ci/tool-versions.env
          cargo install cargo-sort --version "$SHARED_TOOLING_CARGO_SORT_VERSION" --locked
          cargo install cargo-sort-derives --version "$ICYDB_CARGO_SORT_DERIVES_VERSION" --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Run static validation with complete feedback
        run: make ci-static

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: core
            make_target: ci-core
            hard_timeout_seconds: "0"
          - lane: workspace
            make_target: ci-workspace
            hard_timeout_seconds: "0"
          - lane: tier-a
            make_target: ci-sql-tier-a
            hard_timeout_seconds: "600"
          - lane: tier-b
            make_target: ci-sql-tier-b
            hard_timeout_seconds: "780"
    env:
      IC_TESTKIT_ALLOW_POCKET_IC_DOWNLOAD: "1"
      TMPDIR: ${{ github.workspace }}/.cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install wasm target
        if: matrix.lane == 'tier-b'
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Restrict cache scanning to the real workspace root.
          # trybuild generates temporary Cargo.toml files under target/tests,
          # and scanning those can make the cache action probe missing paths
          # like target/tests/target in post-job cleanup.
          workspaces: |
            . -> target
          # Keep registry/git caching, but avoid unstable target-dir probing
          # from ephemeral trybuild workspaces under `target/tests`.
          cache-targets: "false"
      - name: Cache Tier B Wasm artifacts
        if: matrix.lane == 'tier-b'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Retained outputs are revalidated by ic-testkit. Leave mutable Cargo
          # and trybuild targets out of this cache.
          path: |
            ${{ env.CARGO_TARGET_DIR }}/canister-local/.ic-testkit/wasm-targets
            ${{ env.CARGO_TARGET_DIR }}/canister-artifact-cache
          key: icydb-tier-b-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CURRENT }}-${{ github.sha }}
          restore-keys: |
            icydb-tier-b-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_CURRENT }}-
      - name: Install pinned Tier B Wasm optimizer
        if: matrix.lane == 'tier-b'
        run: bash scripts/ci/install-wasm-optimizer.sh
      - run: cargo fetch --locked
      - name: Install exact locked PocketIC server
        if: matrix.lane == 'tier-b'
        run: |
          pocket_ic_bin="$(bash scripts/ci/install-pocketic.sh)"
          echo "POCKET_IC_BIN=$pocket_ic_bin" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.lane }} validation with complete feedback
        env:
          HARD_TIMEOUT_SECONDS: ${{ matrix.hard_timeout_seconds }}
          MAKE_TARGET: ${{ matrix.make_target }}
        run: |
          if [[ "$HARD_TIMEOUT_SECONDS" == "0" ]]; then
            make "$MAKE_TARGET"
          else
            timeout --signal=TERM --kill-after=30s "${HARD_TIMEOUT_SECONDS}s" make "$MAKE_TARGET"
          fi

  macos_host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTC_WRAPPER: ""
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install native workstation prerequisites and tools
        run: make install-dev
      - name: Expose installed tool directories
        run: |
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Qualify portable automation with system Bash
        run: |
          export PATH="/bin:/usr/bin:/usr/sbin:/sbin:$PATH"
          /bin/bash --version
          /bin/bash scripts/ci/verify-shared-tooling-snapshot.sh
          /bin/bash scripts/ci/test-shared-tooling-adapters.sh
          /bin/bash scripts/ci/test-workstation-setup.sh
          /bin/bash scripts/ci/test-pre-commit.sh
          /bin/bash scripts/release/test-standard-release.sh
          /bin/bash scripts/release/test-receipt-callbacks.sh
          /bin/bash scripts/release/test-pin-exceptions.sh
          make check-dependency-pins
          /bin/bash scripts/ci/test-publish-workspace.sh
          /bin/bash scripts/ci/test-wasm-audit-report.sh
          /bin/bash scripts/ci/verify-wasm-optimizer.sh
          shellcheck --exclude=SC2001,SC2016 scripts/dev/workstation-setup.sh scripts/ci/install-gh.sh scripts/ci/install-wasm-optimizer.sh scripts/ci/verify-wasm-optimizer.sh scripts/ci/wasm-optimizer-pin.sh scripts/ci/wasm-report-common.sh scripts/ci/wasm-size-report.sh scripts/ci/wasm-audit-report.sh scripts/ci/test-workstation-setup.sh scripts/ci/test-wasm-audit-report.sh
      - name: Qualify native library and CLI builds
        run: |
          cargo fetch --locked
          cargo clippy --locked -p icydb-testing-integration --lib --bin write_wasm_size_report -- -D warnings
          cargo clippy --locked -p icydb-cli --bin icydb -- -D warnings
          cargo test --locked -p icydb-testing-integration --lib wasm_optimizer::tests::post_link_optimizer_contract_is_exact_and_available
          cargo test --locked -p icydb-testing-integration --bin write_wasm_size_report
          cargo test --locked -p icydb-core --lib --all-features db::integrity::tests::quick_
          make build-canister-production CANISTER=default_empty
          make fmt-check
          icp --version
          ic-wasm --version

  # Preserve the existing required-check identity while the independent lanes
  # finish in parallel and report their own complete failure sets.
  check:
    if: always()
    needs: [static, rust, macos_host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          MACOS_RESULT: ${{ needs.macos_host.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$RUST_RESULT" = "success"
          test "$MACOS_RESULT" = "success"

  wasm_size_report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_CURRENT }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
          cache-targets: "false"
      - run: cargo fetch --locked
      - name: Check shared SQL source in both Wasm profiles
        run: |
          cargo check --locked --target wasm32-unknown-unknown \
            -p canister_test_sql -p canister_test_sql_bounded \
            --no-default-features --features sql
          cargo check --locked --target wasm32-unknown-unknown \
            -p canister_test_sql -p canister_test_sql_bounded \
            --no-default-features --features local-sql-query,test-admin-api,candid-export
      - name: Install pinned Wasm optimizer
        run: bash scripts/ci/install-wasm-optimizer.sh
      - name: Install wasm reporting tools
        run: |
          source ci/tool-versions.env
          cargo install candid-extractor --version "$ICYDB_CANDID_EXTRACTOR_VERSION" --locked
          cargo install ic-wasm --version "$ICYDB_IC_WASM_VERSION" --locked
          test -x "$CARGO_HOME/bin/candid-extractor"
          test -x "$CARGO_HOME/bin/ic-wasm"
          printf '%s\n' "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Report default-empty and request-future-scale wasm sizes
        run: bash scripts/ci/wasm-size-report.sh --profile wasm-release --canister default_empty --canister request_future_scale
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-size-report
          path: artifacts/wasm-size/*
          if-no-files-found: error

  release:
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [dependency_msrv, check, wasm_size_report]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-size-report
          path: release-input
      - name: Stage verified production Wasm
        run: |
          mkdir -p artifacts
          cp release-input/default_empty.wasm-release.final-deployable.wasm artifacts/default_empty.wasm
          cp release-input/default_empty.wasm-release.did artifacts/default_empty.did
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-artifacts
          path: |
            artifacts/default_empty.wasm
            artifacts/default_empty.did
          if-no-files-found: error
