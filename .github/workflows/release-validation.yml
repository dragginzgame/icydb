name: Release mapping qualification
on:
  # Explicit acceptance after contract/mapping changes; never an extra pair of
  # complete gates on every ordinary push, PR or release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo/icydb
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/icydb
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-rust
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Prepare the declared native workstation
        run: make install-dev
      - name: Prepare the fixed dependency cache
        run: make fetch
      - name: Compare actual full and selected CLI plans
        run: bash scripts/release/qualify-native-validation.sh
      - name: Retain comparison, source bundle and raw execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-mapping-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/release-validation-native.*/evidence/
          if-no-files-found: error
          retention-days: 30
