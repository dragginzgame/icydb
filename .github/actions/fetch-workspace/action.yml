name: Fetch locked workspace dependencies
description: Fetch the exact private IC Wire pin using repository-scoped read-only access.
inputs:
  app-id:
    description: ID of the GitHub App installed only on dragginzgame/ic-wire.
    required: true
  private-key:
    description: Private key for that read-only installation; supplied by Actions secrets.
    required: true
runs:
  using: composite
  steps:
    - name: Require configured private dependency access
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_KEY: ${{ inputs.private-key }}
      run: |
        if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
          echo '::error::Configure IC_WIRE_APP_ID and IC_WIRE_APP_PRIVATE_KEY for the read-only ic-wire installation. Fork PRs require a trusted branch run; do not expose credentials through pull_request_target.'
          exit 1
        fi
    - name: Mint read-only token for IC Wire
      id: wire
      uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: dragginzgame
        repositories: ic-wire
        permission-contents: read
    - name: Fetch the locked graph
      shell: bash
      env:
        IC_WIRE_FETCH_TOKEN: ${{ steps.wire.outputs.token }}
        CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        # Step-scoped configuration and token: no secret is written to Git
        # configuration, Cargo caches, credentials files or GITHUB_ENV.
        GIT_CONFIG_COUNT: '3'
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_KEY_1: credential.https://github.com/dragginzgame/ic-wire.git.helper
        GIT_CONFIG_VALUE_1: >-
          !f() { [ "$1" = get ] || return 0; protocol='' host='' path='';
          while IFS='=' read -r key value; do case "$key" in
          protocol) protocol="$value" ;; host) host="$value" ;;
          path) path="$value" ;; '') break ;; esac; done;
          [ "$protocol" = https ] && [ "$host" = github.com ] &&
          [ "$path" = dragginzgame/ic-wire.git ] || return 0;
          printf "%s\n" "username=x-access-token" "password=$IC_WIRE_FETCH_TOKEN"; }; f "$@"
        GIT_CONFIG_KEY_2: credential.useHttpPath
        GIT_CONFIG_VALUE_2: 'true'
        GIT_TERMINAL_PROMPT: '0'
      run: cargo fetch --locked
