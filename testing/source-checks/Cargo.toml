[package]
name = "icydb-testing-source-checks"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.303.0"
publish = false
license-file = { workspace = true }
description = "Shared development-only structural source checks"
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.shared-tooling.loc]
category = "build_tooling"

[[bin]]
name = "check_runtime_panics"
path = "../../scripts/ci/check-runtime-panics.rs"

[dependencies]
clap = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["full", "visit"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
