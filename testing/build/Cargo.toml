[package]
name = "icydb-testing-build"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false
license-file = { workspace = true }
description = "Maintained canister build and Wasm report tooling for IcyDB"
repository = { workspace = true }
authors = { workspace = true }

[dependencies]
blake3 = { workspace = true }
candid = { workspace = true }
ic-build = { workspace = true }
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
ic-host-tools = { workspace = true, features = ["candid-extraction", "candid-service"] }
ic-metrics = { workspace = true }
icydb = { workspace = true, default-features = true, features = ["metrics", "migration", "sql"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true
