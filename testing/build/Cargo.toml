[package]
name = "icydb-testing-build"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false
license = { workspace = true }
description = "Maintained canister build and Wasm report tooling for IcyDB"
repository = { workspace = true }
authors = { workspace = true }

[dependencies]
blake3 = { workspace = true }
candid = { workspace = true }
ic-build = { workspace = true }
ic-host-artifacts = { workspace = true, features = ["wasm"] }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
ic-host-tools = { workspace = true, features = ["candid-service", "ic-interface"] }
ic-metrics = { workspace = true }
ic-wire = { workspace = true }
icydb = { workspace = true, default-features = true, features = ["metrics", "migration", "sql"] }
icydb-testing-wasm-helpers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
