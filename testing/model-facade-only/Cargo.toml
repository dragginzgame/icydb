[package]
workspace = "../canic-adapter"
name = "icydb-testing-model-facade-only"
build = "src/build.rs"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false
license-file = { workspace = true }
description = "Compile contract for model authoring through the IcyDB facade"
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
canic-icydb = { workspace = true }
ic-platform = { workspace = true, features = ["ic0"] }
icydb-testing-canic-adapter = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }
runtime_api = { workspace = true, default-features = true }

[build-dependencies]
runtime_api = { workspace = true, default-features = true, features = ["build"] }

[dev-dependencies]
# The independent integration workspace owns this qualification dependency.
ic-storage = { workspace = true }
serde_json = { workspace = true }
toko-tooling.workspace = true

[lints]
workspace = true

[package.metadata.shared-tooling.loc]
category = "tests"
