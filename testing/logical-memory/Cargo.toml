[package]
workspace = "../canic-adapter"
name = "canister_test_logical_memory"
build = "src/build.rs"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
crate-type = ["cdylib"]

[features]
omit-retiring-store = []

[dependencies]
canic-icydb = { workspace = true }
ic-storage = { workspace = true }
ic-platform = { workspace = true, features = ["ic0"] }
icydb = { workspace = true, default-features = true }
icydb-testing-canic-adapter = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }

[build-dependencies]
icydb = { workspace = true, default-features = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[dev-dependencies]
toko-tooling.workspace = true
