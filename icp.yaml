canisters:
  - name: default_empty
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh default_empty

  - name: default_empty_metrics
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh default_empty_metrics

  - name: one_entity_dynamic_query
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh one_entity_dynamic_query

  - name: one_entity_sql_query
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh one_entity_sql_query

  - name: one_entity_typed_query
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh one_entity_typed_query

  - name: sql_perf
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh sql_perf

  - name: ten_entity_typed_query
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh ten_entity_typed_query

  - name: demo_rpg
    build:
      steps:
        - type: script
          commands:
            - scripts/app/build.sh demo_rpg

networks:
  - name: local
    mode: managed
    gateway:
      bind: 127.0.0.1
      port: 8002

environments:
  - name: demo
    network: local
    canisters: [demo_rpg]

  - name: test
    network: local
    canisters: [demo_rpg, default_empty, default_empty_metrics, one_entity_dynamic_query, one_entity_sql_query, one_entity_typed_query, sql_perf, ten_entity_typed_query]

  - name: audit
    network: local
    canisters: [default_empty, default_empty_metrics, one_entity_dynamic_query, one_entity_sql_query, one_entity_typed_query, sql_perf, ten_entity_typed_query]
