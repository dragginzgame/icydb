[package]
name = "icydb-core"
edition = { workspace = true }
rust-version = "1.91.0"
version = { workspace = true }
license-file = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[lib]
doctest = false

[features]
default = []
sql = []
metrics = ["dep:ic-metrics"]
migration = []

[dependencies]
base64 = { workspace = true }
ic-memory = { workspace = true }
ic-metrics = { workspace = true, optional = true }
ic-platform = { workspace = true, features = ["blake3", "ic0"] }
ic-storage = { workspace = true }
icydb-diagnostic-code = { workspace = true }
icydb-schema = { workspace = true }
rand_chacha = { workspace = true }
remain = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-wire = { workspace = true, features = ["typescript"] }
serde_json = { workspace = true }

[dev-dependencies]
icydb-testing-sql-generator = { workspace = true }
icydb-testing-sqlite-reference = { workspace = true }
proptest = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
trybuild = { workspace = true }

[[test]]
name = "compile"
path = "tests/compile.rs"
required-features = ["sql"]

[lints]
workspace = true
