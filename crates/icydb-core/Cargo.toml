[package]
name = "icydb-core"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.310.2"
license-file = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[lib]
doctest = false

[features]
default = []
wire-schema = ["icydb-schema/wire-schema", "ic-wire/typescript", "dep:serde_json"]
sql = []
metrics = ["dep:ic-metrics"]
migration = []

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
ic-entropy = { workspace = true }
ic-metrics = { workspace = true, optional = true }
ic-storage = { workspace = true }
ic-wire = { workspace = true }
icydb-diagnostic-code = { workspace = true }
icydb-schema = { workspace = true }
remain = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
xxhash-rust = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
serde_json = { workspace = true, optional = true }

# Direct IC system calls exist only in the Wasm runtime branches.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ic-platform-runtime = { workspace = true, features = ["ic0"] }

[dev-dependencies]
ic-platform-types = { workspace = true }
ic-storage = { workspace = true, features = ["test-support"] }
icydb-testing-sql-generator = { workspace = true }
icydb-testing-sqlite-reference = { workspace = true }
proptest = { workspace = true }
syn = { workspace = true, features = ["full", "visit"] }
trybuild = { workspace = true }

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[[test]]
name = "compile"
path = "tests/compile.rs"
required-features = ["sql"]

[lints]
workspace = true
