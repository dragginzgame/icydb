[package]
name = "icydb-model"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.303.0"
license-file = { workspace = true }
description = "IcyDB application-model authoring, validation, and code generation"
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
wire-schema = [
    "icydb-schema/wire-schema",
    "dep:ic-wire",
    "ic-wire/typescript",
    "dep:serde_json",
]
build = [
    "dep:ctor",
    "dep:proc-macro-crate",
    "dep:proc-macro2",
    "dep:quote",
    "dep:serde_json",
    "dep:sha2",
    "dep:syn",
]

[dependencies]
convert_case = { workspace = true }
icydb-model-macros = { workspace = true }
icydb-schema = { workspace = true }
remain = { workspace = true }
serde = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctor = { workspace = true, optional = true }
proc-macro-crate = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
syn = { workspace = true, features = ["full"], optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-wire = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
toko-tooling.workspace = true
trybuild = { workspace = true }

[[test]]
name = "boolean_truth"
required-features = ["build"]

[[test]]
name = "schema_literals"
required-features = ["build"]

[[test]]
name = "storage_namespaces"
required-features = ["build"]

[lints]
workspace = true
