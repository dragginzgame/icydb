[package]
name = "icydb"
autotests = false
edition = { workspace = true }
rust-version = "1.88.0"
version = { workspace = true }
license = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[features]
default = []
sql = ["icydb-core/sql"]
diagnostics = ["icydb-core/diagnostics"]
migration = ["icydb-core/migration"]

[dependencies]
candid = { workspace = true }
ic-cdk = { workspace = true }
ic-cdk-timers = { workspace = true }
ic-memory = { workspace = true }
icydb-core = { workspace = true }
icydb-diagnostic-code = { workspace = true }
icydb-model = { workspace = true }
icydb-model-macros = { workspace = true }
icydb-schema = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }

[[test]]
name = "compile"
path = "tests/compile.rs"

[[test]]
name = "default_memory_manager"
path = "tests/default_memory_manager.rs"

[[test]]
name = "compile_pass_endpoint_declarations"
path = "tests/pass/endpoint_declarations.rs"

[[test]]
name = "compile_pass_lifecycle_declarations"
path = "tests/pass/lifecycle_declarations.rs"

[[test]]
name = "compile_pass_structural_write_surface"
path = "tests/pass/structural_write_surface.rs"

[[test]]
name = "compile_pass_dynamic_query"
path = "tests/pass-query/dynamic_query.rs"

[[test]]
name = "compile_pass_migration_capability"
path = "tests/pass-migration/capability.rs"
required-features = ["migration"]

[[test]]
name = "compile_pass_migration_endpoints"
path = "tests/pass-migration/endpoints.rs"
required-features = ["migration"]

[[test]]
name = "compile_pass_sql_query_introspection"
path = "tests/pass-sql/endpoint_query_introspection.rs"
required-features = ["sql"]

[[test]]
name = "compile_pass_sql_update_bounded"
path = "tests/pass-sql/endpoint_update_bounded.rs"
required-features = ["sql"]

[[test]]
name = "compile_pass_sql_update_primary_key"
path = "tests/pass-sql/endpoint_update_primary_key.rs"
required-features = ["sql"]

[[test]]
name = "compile_pass_trusted_sql"
path = "tests/pass-sql/trusted_sql_query.rs"
required-features = ["sql"]

[lints]
workspace = true
