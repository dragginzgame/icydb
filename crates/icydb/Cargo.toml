[package]
name = "icydb"
autotests = false
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.307.0"
license-file = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[features]
default = []
wire-schema = [
    "icydb-core/wire-schema",
    "icydb-model/wire-schema",
    "icydb-schema/wire-schema",
    "ic-wire/typescript",
]
build = ["icydb-model/build"]
sql = ["icydb-core/sql"]
metrics = ["icydb-core/metrics"]
migration = ["icydb-core/migration"]
testing = ["dep:ic-testkit"]

[dependencies]
ic-platform-runtime = { workspace = true, features = ["ic0"] }
ic-platform-types = { workspace = true }
ic-storage = { workspace = true }
ic-wire = { workspace = true }
icydb-core = { workspace = true }
icydb-diagnostic-code = { workspace = true }
icydb-model = { workspace = true }
icydb-model-macros = { workspace = true }
icydb-schema = { workspace = true }
serde = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ic-testkit = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
ic-platform-types = { workspace = true, features = ["principal-self-authenticating"] }
ic-storage = { workspace = true, features = ["test-support"] }
toko-tooling.workspace = true
trybuild = { workspace = true }

[[test]]
name = "storage_bootstrap"
path = "tests/storage_bootstrap.rs"

[[test]]
name = "startup_polling"
path = "tests/startup_polling.rs"
required-features = ["testing"]

[[test]]
name = "platform_types"
path = "tests/platform_types.rs"

[[test]]
name = "memory_admission"
path = "tests/memory_admission.rs"

[[test]]
name = "compile"
path = "tests/compile.rs"

[[test]]
name = "compile_pass_structural_write_surface"
path = "tests/pass/structural_write_surface.rs"

[[test]]
name = "compile_pass_typed_enrollment"
path = "tests/pass/typed_enrollment.rs"

[[test]]
name = "compile_pass_dynamic_query"
path = "tests/pass-query/dynamic_query.rs"

[[test]]
name = "compile_pass_migration_capability"
path = "tests/pass-migration/capability.rs"
required-features = ["migration"]

[[test]]
name = "compile_pass_trusted_sql"
path = "tests/pass-sql/trusted_sql_query.rs"
required-features = ["sql"]

[lints]
workspace = true
