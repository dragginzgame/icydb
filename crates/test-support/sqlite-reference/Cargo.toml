[package]
name = "icydb-testing-sqlite-reference"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = "0.310.1"
publish = false
description = "Pinned SQLite reference adapter for IcyDB SQL correctness tests"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[dependencies]
blake3 = { workspace = true }
icydb-testing-sql-generator = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syn = { workspace = true, features = ["full"] }
toko-tooling.workspace = true

[lints]
workspace = true
