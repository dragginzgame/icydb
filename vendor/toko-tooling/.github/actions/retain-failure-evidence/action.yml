name: Retain failed validation and installer evidence
# Shared companions: scripts/ci/collect-tool-evidence.sh scripts/ci/formatting-evidence.sh
description: One collection contract for ordinary failures and hosted retention qualification.
inputs:
  name:
    description: Unique artifact name for this job and attempt.
    required: true
  temp-root:
    description: Absolute root containing validation logs and portable-fixtures.
  repository-root:
    description: Absolute checkout root containing retained tool candidates.
  prepared-archive:
    description: Absolute caller-prepared archive path; pair with collection-log to upload existing files without collecting tools again.
  collection-log:
    description: Absolute original collection log path; uploaded even when the prepared archive is missing.
  compact-successful-tools:
    description: Recheck declared active toolsets and retain their pins/check evidence instead of bulky payloads; failed and unselected sets stay full.
    default: 'false'
  host-versions:
    description: Absolute host pin exception for compact checking; defaults to this action's snapshot ci/tool-versions.env.
  ic-pins:
    description: Absolute IC pin exception for compact checking; defaults to this action's snapshot ci/ic-tools.tsv.
  ic-tools:
    description: Space-separated IC executable selection for compact checking; omitted selections retain full IC bundles.
outputs:
  collection-complete:
    description: Whether shared collection completed, or both caller-prepared files were available; prepared contents remain caller-qualified.
    value: ${{ steps.archive.outputs.collection-complete }}
  artifact-id:
    description: Uploaded artifact identity, used for the hosted round-trip check.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-digest:
    description: SHA-256 of the uploaded ZIP, used to authenticate exact-ID readback.
    value: ${{ steps.upload.outputs.artifact-digest }}
runs:
  using: composite
  steps:
    - id: archive
      if: ${{ always() && (inputs.prepared-archive != '' || inputs.collection-log != '' || !cancelled()) }}
      shell: bash
      env:
        EVIDENCE_PREPARED_ARCHIVE: ${{ inputs.prepared-archive }}
        EVIDENCE_COLLECTION_LOG: ${{ inputs.collection-log }}
        EVIDENCE_TEMP_ROOT: ${{ inputs.temp-root }}
        EVIDENCE_REPOSITORY_ROOT: ${{ inputs.repository-root }}
        EVIDENCE_ACTION_ROOT: ${{ github.action_path }}
        EVIDENCE_COMPACT: ${{ inputs.compact-successful-tools }}
        EVIDENCE_HOST_VERSIONS: ${{ inputs.host-versions }}
        EVIDENCE_IC_PINS: ${{ inputs.ic-pins }}
        EVIDENCE_IC_TOOLS: ${{ inputs.ic-tools }}
      run: |
        if [[ -n "${EVIDENCE_PREPARED_ARCHIVE:-}" || -n "${EVIDENCE_COLLECTION_LOG:-}" ]]; then
          # Inputs are literal paths, never commands, globs or multiline output.
          paths=()
          complete=true
          for path in "$EVIDENCE_PREPARED_ARCHIVE" "$EVIDENCE_COLLECTION_LOG"; do
            [[ "$path" == /* && "$path" != *$'\n'* && "$path" != *$'\r'* &&
               "$path" != *\** && "$path" != *\?* && "$path" != *\[* ]] || exit 2
            if [[ -f "$path" && ! -L "$path" ]]; then paths+=("$path")
            else complete=false; fi
          done
          [[ "$EVIDENCE_PREPARED_ARCHIVE" != "$EVIDENCE_COLLECTION_LOG" ]] || exit 2
          printf 'collection-complete=%s\n' "$complete" >> "$GITHUB_OUTPUT"
          if [[ ${#paths[@]} != 0 ]]; then
            { printf 'path<<EVIDENCE_PATHS\n'; printf '%s\n' "${paths[@]}"; printf 'EVIDENCE_PATHS\n'; } >> "$GITHUB_OUTPUT"
          fi
          exit 0
        fi
        temp_root="$EVIDENCE_TEMP_ROOT"
        repository_root="$EVIDENCE_REPOSITORY_ROOT"
        [[ -n "$temp_root" && -n "$repository_root" ]] || {
          echo 'temp-root and repository-root are required when collecting evidence' >&2
          exit 2
        }
        [[ "$temp_root" == /* ]] || temp_root="$PWD/$temp_root"
        [[ "$repository_root" == /* ]] || repository_root="$PWD/$repository_root"
        [[ -d "$temp_root" && -d "$repository_root" ]] || exit 1
        inputs=()
        shopt -s nullglob
        for path in "$temp_root/portable-regression.log" "$temp_root/portable-fixtures" \
            "$temp_root"/tools-*.log "$temp_root"/host-tools-*.log "$temp_root"/ic-tools-*.log "$temp_root"/rust-tools-*.log; do
          if [[ -e "$path" || -L "$path" ]]; then inputs+=("$temp_root" "${path#"$temp_root/"}"); fi
        done
        source "$EVIDENCE_ACTION_ROOT/../../../scripts/ci/formatting-evidence.sh"
        select_formatting_evidence "$temp_root"
        inputs+=(${formatting_evidence[@]+"${formatting_evidence[@]}"})
        case "${EVIDENCE_COMPACT:-false}" in
          false) selection=(full) ;;
          true) selection=(compact) ;;
          *) echo 'compact-successful-tools must be true or false' >&2; exit 2 ;;
        esac
        ic_selection=()
        [[ "${selection[0]}" != compact ]] || ic_selection=("${EVIDENCE_IC_TOOLS:-}")
        diagnostics="$(mktemp -d "$temp_root/tool-evidence.XXXXXX")"
        archive="$(mktemp -d "$RUNNER_TEMP/shared-evidence.XXXXXX")/evidence.tar.gz"
        collector_status=0
        bash "$EVIDENCE_ACTION_ROOT/../../../scripts/ci/collect-tool-evidence.sh" \
          "$archive" "$repository_root" "$diagnostics" "${selection[0]}" \
          "${EVIDENCE_HOST_VERSIONS:-$EVIDENCE_ACTION_ROOT/../../../ci/tool-versions.env}" \
          "${EVIDENCE_IC_PINS:-$EVIDENCE_ACTION_ROOT/../../../ci/ic-tools.tsv}" \
          ${ic_selection[@]+"${ic_selection[@]}"} \
          ${inputs[@]+"${inputs[@]}"} > "${archive%/*}/archive-path" || collector_status=$?
        [[ "$collector_status" != 2 ]] || exit "$collector_status"
        complete=true
        [[ "$collector_status" == 0 ]] || complete=false
        printf 'collection-complete=%s\n' "$complete" >> "$GITHUB_OUTPUT"
        if [[ -s "${archive%/*}/archive-path" ]]; then
          printf 'path=%s\n' "$(cat "${archive%/*}/archive-path")" >> "$GITHUB_OUTPUT"
        fi
    - id: upload
      if: ${{ always() && steps.archive.outputs.path != '' && (inputs.prepared-archive != '' || inputs.collection-log != '' || !cancelled()) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ steps.archive.outputs.path }}
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
    - id: completeness
      if: ${{ always() && steps.archive.outputs.collection-complete == 'false' && (inputs.prepared-archive != '' || inputs.collection-log != '' || !cancelled()) }}
      shell: bash
      run: |
        echo 'Evidence collection was incomplete; see the retained selection diagnostics.' >&2
        exit 1
