name: Cache pinned tool downloads
description: Restore before tool setup; save after setup, before compilation or tests.
inputs:
  mode:
    description: restore or save (save is restricted to default-branch pushes).
    default: restore
  extra-key:
    description: Fingerprint for custom pin catalogs or additional tool selections.
    default: ''
runs:
  using: composite
  steps:
    - name: Select download cache
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        MODE: ${{ inputs.mode }}
        EXTRA_KEY: ${{ inputs.extra-key }}
      run: |
        case "$MODE" in restore|save) ;; *) echo 'Expected restore or save' >&2; exit 2 ;; esac
        case "$EXTRA_KEY" in *$'\r'*|*$'\n'*) echo 'Invalid cache extra key' >&2; exit 2 ;; esac
        echo "TOKO_TOOLING_DOWNLOAD_CACHE=$RUNNER_TEMP/shared-tool-downloads" >> "$GITHUB_ENV"
    - id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
      with:
        path: ${{ runner.temp }}/shared-tool-downloads
        key: tool-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('vendor/toko-tooling/ci/tool-versions.env', 'vendor/toko-tooling/ci/ic-tools.tsv', 'ci/tool-versions.env', 'ci/ic-tools.tsv', 'Makefile') }}-${{ inputs.extra-key }}
    - name: Save authenticated downloads
      if: inputs.mode == 'save' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/shared-tool-downloads
        key: tool-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('vendor/toko-tooling/ci/tool-versions.env', 'vendor/toko-tooling/ci/ic-tools.tsv', 'ci/tool-versions.env', 'ci/ic-tools.tsv', 'Makefile') }}-${{ inputs.extra-key }}
