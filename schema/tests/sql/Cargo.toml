[package]
name = "icydb-testing-test-sql-fixtures"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = "0.305.0"
publish = false
description = "Small schema fixture crate for lightweight SQL smoke canisters"

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.shared-tooling.loc]
category = "tests"

[features]
build = ["icydb/build"]
default = []
migration-v2 = []
entity-rename = []
entity-rename-successor = ["entity-rename"]
entity-creation = ["entity-rename"]
entity-creation-physical = ["entity-creation"]

[dependencies]
icydb = { workspace = true, default-features = true }
icydb-testing-wasm-helpers = { workspace = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
