[package]
name = "icydb-testing-demo-rpg-fixtures"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.305.0"
publish = false
license-file = { workspace = true }
description = "RPG demo schema fixtures for the demo canister"
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["icydb", "toko-tooling"]

[package.metadata.shared-tooling.loc]
category = "examples"

[features]
default = []
build = ["icydb/build", "icydb-model/build"]

[dependencies]
icydb = { workspace = true, default-features = true }
icydb-model = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
