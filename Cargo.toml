[workspace]
exclude = [
    "canisters/audit/codec_wire_query",
    "canisters/audit/default_empty",
    "canisters/audit/default_empty_metrics",
    "canisters/audit/group_path_sql_query",
    "canisters/audit/nested_relation_direct",
    "canisters/audit/nested_relation_none",
    "canisters/audit/nested_relation_repeated",
    "canisters/audit/nested_relation_shallow",
    "canisters/audit/one_entity_dynamic_query",
    "canisters/audit/one_entity_reachable_operations",
    "canisters/audit/one_entity_sql_query",
    "canisters/audit/one_entity_typed_query",
    "canisters/audit/request_future_scale",
    "canisters/audit/sql_perf",
    "canisters/audit/ten_entity_reachable_operations",
    "canisters/audit/ten_entity_typed_query",
    "canisters/demo/rpg",
    "canisters/tests/lifecycle_participant",
    "canisters/tests/read_authority",
    "canisters/tests/schema_guard",
    "canisters/tests/schema_public",
    "canisters/tests/sql",
    "canisters/tests/sql_bounded",
    "canisters/tests/sql_guard",
    "canisters/tests/wire_rollback",
    "schema/audit/nested_relation",
    "testing/canic-adapter",
    "testing/endpoint-installation",
    "testing/integration",
    "testing/logical-memory",
    "testing/model-facade-only",
]
members = [
    # Production packages
    "crates/icydb",
    "crates/icydb-cli",
    "crates/icydb-core",
    "crates/icydb-diagnostic-code",
    "crates/icydb-model",
    "crates/icydb-model-macros",
    "crates/icydb-schema",
    # Tests and tooling packages
    "schema/audit/default_empty",
    "schema/audit/group_path",
    "schema/audit/one_simple",
    "schema/audit/sql_perf",
    "schema/audit/ten_simple",
    "schema/demo/rpg",
    "schema/tests/fixtures",
    "schema/tests/sql",
    "testing/build",
    "testing/codec-query",
    "testing/model-schema-only",
    "testing/model-typed-adapter",
    "testing/source-checks",
    "testing/sql-generator",
    "testing/sqlite-reference",
    "testing/wasm-helpers",
]
resolver = "3"

[workspace.package]
rust-version = "1.99.1"
edition = "2024"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "IcyDB — A schema-first typed query engine and persistence runtime for Internet Computer canisters"
categories = ["database", "web-programming", "wasm"]
license-file = "LICENSE"
repository = "https://github.com/dragginzgame/icydb"

[workspace.dependencies]
# Database release group
# Changelog : releases/database/CHANGELOG.md
icydb = { path = "crates/icydb", version = "=0.306.0", default-features = false }
icydb-core = { path = "crates/icydb-core", version = "=0.306.0" }
icydb-diagnostic-code = { path = "crates/icydb-diagnostic-code", version = "=0.306.0" }
icydb-model = { path = "crates/icydb-model", version = "=0.306.0" }
icydb-model-macros = { path = "crates/icydb-model-macros", version = "=0.306.0" }
icydb-schema = { path = "crates/icydb-schema", version = "=0.306.0" }
icydb-testing-audit-default-empty-fixtures = { version = "0.306.0", path = "schema/audit/default_empty" }
icydb-testing-audit-group-path-fixtures = { version = "0.306.0", path = "schema/audit/group_path" }
icydb-testing-audit-one-simple-fixtures = { version = "0.306.0", path = "schema/audit/one_simple" }
icydb-testing-audit-sql-perf-fixtures = { version = "0.306.0", path = "schema/audit/sql_perf" }
icydb-testing-audit-ten-simple-fixtures = { version = "0.306.0", path = "schema/audit/ten_simple" }
icydb-testing-build = { version = "0.306.0", path = "testing/build" }
icydb-testing-codec-query = { version = "0.306.0", path = "testing/codec-query" }
icydb-testing-demo-rpg-fixtures = { version = "0.306.0", path = "schema/demo/rpg" }
icydb-testing-model-schema-only = { path = "testing/model-schema-only", version = "0.306.0" }
icydb-testing-model-typed-adapter = { path = "testing/model-typed-adapter", version = "0.306.0" }
icydb-testing-source-checks = { path = "testing/source-checks", version = "0.306.0" }
icydb-testing-sql-generator = { path = "testing/sql-generator" }
icydb-testing-sqlite-reference = { path = "testing/sqlite-reference" }
icydb-testing-test-fixtures = { path = "schema/tests/fixtures", version = "0.306.0" }
icydb-testing-test-sql-fixtures = { version = "0.306.0", path = "schema/tests/sql" }
icydb-testing-wasm-helpers = { version = "0.306.0", path = "testing/wasm-helpers" }
model_api = { version = "0.306.0", package = "icydb-model", path = "crates/icydb-model" }
runtime_api = { version = "0.306.0", package = "icydb", path = "crates/icydb", default-features = false }

# CLI release group
# Changelog : releases/cli/CHANGELOG.md
icydb-cli = { path = "crates/icydb-cli", version = "0.296.7" }

# Production dependencies
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
clap = { version = "4.6.1", default-features = false, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "usage",
] }
convert_case = "0.12"
# Schema registration runs before main and does not request ordered constructors.
ctor = { version = "1.0.0", default-features = false, features = ["proc_macro", "std"] }
darling = "0.24"
ethnum = { version = "1.5.3", default-features = false }
getrandom = "0.4"
ic-entropy = "0.1.0"
ic-host-artifacts = { version = "0.76.2", default-features = false }
ic-host-fs = { version = "0.76.2", default-features = false }
ic-host-process = "0.76.2"
ic-host-text = "0.74.3"
ic-host-tools = "0.89.0"
ic-metrics = { version = "0.29.10", default-features = false }
ic-platform-runtime = { version = "0.21.0", default-features = false }
ic-platform-types = { version = "0.19.0", default-features = false }
ic-storage = "0.71.1"
ic-testkit = { version = "0.97.0", default-features = false }
ic-wire = "0.19.0"
libc = "0.2"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0"
quote = "1.0"
remain = "0.2"
rustyline = { version = "19.0", default-features = false, features = ["with-file-history"] }
serde = { version = "1.0", default-features = false }
serde_bytes = "0.11"
serde_json = "1.0"
# Fixed-size database hashing needs neither allocation nor OID metadata.
sha2 = { version = "0.11.1", default-features = false }
syn = "3.0"
thiserror = "2.0"
time = { version = "0.3.55", default-features = false }
# Keep std disabled because IcyDB owns runtime randomness and monotonic generation.
ulid = { version = "3.0.0", default-features = false }
xxhash-rust = { version = "0.8.15", default-features = false, features = [
    "xxh3",
] }

# Tests and tooling only
ic-build = "0.81.0"
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.41.1", default-features = false, features = [
    "bundled",
    "functions",
    "load_extension",
] }
serde-reflection = "0.6.0"
tokio = { version = "1.54.1", default-features = false }
toko-tooling = "=0.38.2"
trybuild = "1.0"

# ---------------------
#  CLIPPY CONFIGURATION
# ---------------------
[workspace.lints.rust]
unsafe_code = "deny"
unfulfilled_lint_expectations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Rust 1.99 empty-comparison suggestions can use ambiguous or inaccessible types.
# Keep direct is_empty assertions instead of adding type plumbing to tests.
assert_is_empty = "allow"

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnecessary_cast = "warn"
use_self = "warn"

# Workspace style choices, not local defect suppressions: documented module
# banners, explicit crate visibility, owned boundary inputs, test glob imports
# and descriptive module names are intentional across generated/feature surfaces.
# Error contracts are documented at boundary owners; match/if-let syntax stays
# an author choice. Cargo has no expect level; local exceptions use expectations.
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
missing_errors_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
wildcard_imports = "allow"

# ---------------------
#  PATCH SECTION
# ---------------------
# Only needed if you override crates.io during dev.
[patch.crates-io]

# ---------------------
#  DEV PROFILE
# ---------------------
[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
strip = "debuginfo"
debug = false
overflow-checks = true

# -------------------------
#  RELEASE / WASM PROFILES
# -------------------------
[profile.release]
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Audit-only equivalent of `wasm-release` that retains enough symbol data for
# attribution tools. Never use this profile as a deploy-size measurement.
[profile.wasm-attribution]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
