[workspace]
members = [
    "canisters/audit/default_empty",
    "canisters/audit/default_empty_metrics",
    "canisters/audit/one_entity_dynamic_query",
    "canisters/audit/one_entity_sql_query",
    "canisters/audit/one_entity_typed_query",
    "canisters/audit/sql_perf",
    "canisters/audit/ten_entity_typed_query",
    "canisters/demo/rpg",
    "canisters/test/lifecycle_participant",
    "canisters/test/read_authority",
    "canisters/test/schema_guard",
    "canisters/test/schema_public",
    "canisters/test/sql",
    "canisters/test/sql_bounded",
    "canisters/test/sql_guard",
    "canisters/test/startup_timer",
    "crates/icydb",
    "crates/icydb-cli",
    "crates/icydb-core",
    "crates/icydb-diagnostic-code",
    "crates/icydb-model",
    "crates/icydb-model-macros",
    "crates/icydb-schema",
    "schema/audit/default_empty",
    "schema/audit/one_simple",
    "schema/audit/sql_perf",
    "schema/audit/ten_simple",
    "schema/demo/rpg",
    "schema/test/fixtures",
    "schema/test/sql",
    "testing/endpoint-installation",
    "testing/integration",
    "testing/model-schema-only",
    "testing/model-typed-adapter",
    "testing/sql-generator",
    "testing/sqlite-reference",
    "testing/wasm-helpers",
]
resolver = "2"

[workspace.package]
rust-version = "1.96.0"
edition = "2024"
version = "0.243.0"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
description = "IcyDB — A schema-first typed query engine and persistence runtime for Internet Computer canisters"
categories = ["database", "web-programming", "wasm"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/dragginzgame/icydb"

[workspace.dependencies]
blake3 = "1.8.5"
candid = "0.10"
clap = { version = "4.6.1", default-features = false, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "usage",
] }
convert_case = "0.11"
ctor = "1.0.0"
darling = "0.24"
derive_more = { version = "2.0", default-features = false, features = [
    "add",
    "add_assign",
] }
flate2 = "1.1.9"
getrandom = "0.4"
ic-cdk = "0.20.2"
ic-memory = "0.12.3"
ic-stable-structures = "0.7.2"
ic-testkit = "0.8.9"
ic-timers = "0.6.1"
icrc-ledger-types = "0.2.0"
icydb = { path = "crates/icydb", version = "0.243.0" }
icydb-core = { path = "crates/icydb-core", version = "0.243.0" }
icydb-diagnostic-code = { path = "crates/icydb-diagnostic-code", version = "0.243.0" }
icydb-model = { path = "crates/icydb-model", version = "0.243.0" }
icydb-model-macros = { path = "crates/icydb-model-macros", version = "0.243.0" }
icydb-schema = { path = "crates/icydb-schema", version = "0.243.0" }
icydb-testing-audit-default-empty-fixtures = { path = "schema/audit/default_empty" }
icydb-testing-audit-one-simple-fixtures = { path = "schema/audit/one_simple" }
icydb-testing-audit-sql-perf-fixtures = { path = "schema/audit/sql_perf" }
icydb-testing-audit-ten-simple-fixtures = { path = "schema/audit/ten_simple" }
icydb-testing-demo-rpg-fixtures = { path = "schema/demo/rpg" }
icydb-testing-sql-generator = { path = "testing/sql-generator" }
icydb-testing-sqlite-reference = { path = "testing/sqlite-reference" }
icydb-testing-test-fixtures = { path = "schema/test/fixtures" }
icydb-testing-test-sql-fixtures = { path = "schema/test/sql" }
icydb-testing-wasm-helpers = { path = "testing/wasm-helpers" }
num-bigint = "0.4"
pocket-ic = "15.0.0"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0"
proptest = "1.9.0"
quote = "1.0"
rand_chacha = "0.10"
remain = "0.2"
rusqlite = { version = "=0.40.2", default-features = false, features = [
    "bundled",
    "functions",
    "load_extension",
] }
rustyline = "18.0"
serde = { version = "1.0", default-features = false }
serde_bytes = "0.11"
serde_json = "1.0"
# Keep sha2 aligned with the canister runtime stack to avoid duplicate 0.10/0.11
# digest trees in wasm builds.
sha2 = "0.10.9"
syn = "3.0"
thiserror = "2.0"
time = { version = "0.3.55", default-features = false }
trybuild = "1.0"
# Keep std disabled because IcyDB owns runtime randomness and monotonic generation.
ulid = { version = "3.0.0", default-features = false }
xxhash-rust = { version = "0.8.15", default-features = false, features = [
    "xxh3",
] }

# ---------------------
#  CLIPPY CONFIGURATION
# ---------------------
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnecessary_cast = "warn"
use_self = "warn"

doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
missing_errors_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
wildcard_imports = "allow"

# ---------------------
#  PATCH SECTION
# ---------------------
# Only needed if you override crates.io during dev.
[patch.crates-io]
icydb = { path = "crates/icydb" }
icydb-core = { path = "crates/icydb-core" }
icydb-diagnostic-code = { path = "crates/icydb-diagnostic-code" }
icydb-model = { path = "crates/icydb-model" }
icydb-model-macros = { path = "crates/icydb-model-macros" }
icydb-schema = { path = "crates/icydb-schema" }

# ---------------------
#  DEV PROFILE
# ---------------------
[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
strip = "debuginfo"
debug = false
overflow-checks = true

# -------------------------
#  RELEASE / WASM PROFILES
# -------------------------
[profile.release]
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Audit-only equivalent of `wasm-release` that retains enough symbol data for
# attribution tools. Never use this profile as a deploy-size measurement.
[profile.wasm-attribution]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
