[package]
name = "icydb-testing-build"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.307.0"
publish = false
license-file = { workspace = true }
description = "Maintained canister build and Wasm report tooling for IcyDB"
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "build_tooling"

[dependencies]
clap = { workspace = true }
ic-build = { workspace = true }
ic-host-artifacts = { workspace = true, features = ["gzip", "wasm"] }
ic-host-fs = { workspace = true }
ic-host-process = { workspace = true }
ic-host-tools = { workspace = true, features = ["ic-interface"] }
icydb = { workspace = true, default-features = true, features = ["metrics", "migration", "sql"] }
icydb-schema = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
ic-host-fs = { workspace = true, features = ["test-support"] }
ic-host-process = { workspace = true, features = ["test-support"] }
ic-wire = { workspace = true, features = ["typescript"] }
icydb = { workspace = true, features = ["wire-schema"] }
icydb-core = { workspace = true, features = ["metrics", "migration", "sql", "wire-schema"] }
icydb-schema = { workspace = true, features = ["wire-schema"] }
serde-reflection = { workspace = true }

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
