[package]
name = "icydb-testing-startup"
edition = { workspace = true }
rust-version = { workspace = true }
version = "0.307.0"
publish = false
license-file = { workspace = true }
description = "Native qualification of typed IcyDB startup with Testkit"
repository = { workspace = true }
authors = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["toko-tooling"]

[package.metadata.toko-tooling.loc]
category = "tests"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
ic-testkit = { workspace = true }
icydb = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[dev-dependencies]
toko-tooling.workspace = true

[lints]
workspace = true
