[workspace]
members = [
    "build",
    "codec-query",
    "model-schema-only",
    "model-typed-adapter",
    "schema/audit/default_empty",
    "schema/audit/group_path",
    "schema/audit/one_simple",
    "schema/audit/sql_perf",
    "schema/audit/ten_simple",
    "schema/demo/rpg",
    "schema/tests/fixtures",
    "schema/tests/sql",
    "source-checks",
    "startup",
    "wasm-helpers",
]
resolver = "3"

[workspace.package]
rust-version = "1.100.0"
edition = "2024"
authors = ["borovan <84897664+borovan@users.noreply.github.com>"]
license-file = "../LICENSE.md"
repository = "https://github.com/dragginzgame/icydb"

[workspace.dependencies]
# Database release group
# Changelog : releases/database/CHANGELOG.md
icydb = { path = "../crates/icydb", version = "=0.310.2", default-features = false }
icydb-core = { path = "../crates/icydb-core", version = "=0.310.2" }
icydb-model = { path = "../crates/icydb-model", version = "=0.310.2" }
icydb-schema = { path = "../crates/icydb-schema", version = "=0.310.2" }
icydb-testing-wasm-helpers = { version = "0.307.0", path = "wasm-helpers" }
model_api = { version = "0.310.2", package = "icydb-model", path = "../crates/icydb-model" }
runtime_api = { version = "0.310.2", package = "icydb", path = "../crates/icydb", default-features = false }
# CLI release group
# Changelog : releases/cli/CHANGELOG.md

# Production dependencies
clap = { version = "4.6.1", default-features = false, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "usage",
] }
# Schema registration runs before main and does not request ordered constructors.
ic-host-artifacts = { version = "0.77.0", default-features = false }
ic-host-fs = { version = "0.77.0", default-features = false }
ic-host-process = "0.77.0"
ic-host-tools = "0.92.0"
ic-platform-runtime = { version = "0.22.1", default-features = false }
ic-testkit = { version = "0.102.0", default-features = false }
ic-wire = "0.22.0"
proc-macro2 = "1.0"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
# Fixed-size database hashing needs neither allocation nor OID metadata.
syn = "3.0"
# Keep std disabled because IcyDB owns runtime randomness and monotonic generation.

# Tests and tooling only
ic-build = "0.84.1"
serde-reflection = "0.6.0"
tokio = { version = "1.54.1", default-features = false }
toko-tooling = "=0.42.4"

# ---------------------
#  CLIPPY CONFIGURATION
# ---------------------
[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
unused_workspace_package_fields = "deny"
missing_lints_inheritance = "deny"
unknown_lints = "deny"

[workspace.lints.rust]
dead_code = "deny"
unused_must_use = "deny"
unfulfilled_lint_expectations = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_markdown_table = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"

# Rust 1.99 empty-comparison suggestions can use ambiguous or inaccessible types.
# Keep direct is_empty assertions instead of adding type plumbing to tests.
assert_is_empty = "allow"

missing_const_for_fn = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnecessary_cast = "warn"
use_self = "warn"

# Workspace style choices, not local defect suppressions: documented module
# banners, explicit crate visibility, owned boundary inputs, test glob imports
# and descriptive module names are intentional across generated/feature surfaces.
# Error contracts are documented at boundary owners; match/if-let syntax stays
# an author choice. Cargo has no expect level; local exceptions use expectations.
doc_markdown = "allow"
empty_line_after_doc_comments = "allow"
missing_errors_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "warn"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
wildcard_imports = "warn"

# ---------------------
#  PATCH SECTION
# ---------------------
# Only needed if you override crates.io during dev.
[patch.crates-io]

# ---------------------
#  DEV PROFILE
# ---------------------
[profile.dev]
opt-level = 1
lto = false
codegen-units = 16
strip = "debuginfo"
debug = false
overflow-checks = true

# -------------------------
#  RELEASE / WASM PROFILES
# -------------------------
[profile.release]
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

# Audit-only equivalent of `wasm-release` that retains enough symbol data for
# attribution tools. Never use this profile as a deploy-size measurement.
[profile.wasm-attribution]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"
debug = "line-tables-only"
