[package]
name = "canister_test_sql"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
sql = ["icydb/sql"]
local-sql-query = ["sql"]
schema-migration-api = ["icydb/migration"]
schema-migration-v2 = ["schema-migration-api", "icydb-testing-test-sql-fixtures/migration-v2"]
entity-rename = ["schema-migration-api", "icydb-testing-test-sql-fixtures/entity-rename"]
entity-rename-successor = ["entity-rename", "icydb-testing-test-sql-fixtures/entity-rename-successor"]
entity-creation = ["entity-rename", "icydb-testing-test-sql-fixtures/entity-creation"]
entity-creation-physical = ["entity-creation", "icydb-testing-test-sql-fixtures/entity-creation-physical"]
test-admin-api = ["sql"]

[dependencies]
canic-icydb = { workspace = true }
ic-cdk = { workspace = true }
ic-timers = { workspace = true }
icydb = { workspace = true, features = ["metrics"] }
icydb-model = { workspace = true }
icydb-testing-test-sql-fixtures = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }
serde = { workspace = true }

[build-dependencies]
icydb = { workspace = true }
icydb-testing-test-sql-fixtures = { workspace = true }

[lints]
workspace = true
