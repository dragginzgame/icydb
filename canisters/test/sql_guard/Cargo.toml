[package]
workspace = "../../../testing/canic-adapter"
name = "canister_test_sql_guard"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["icydb-testing-audit-one-simple-fixtures"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
guarded-sql-query = ["ic-platform/principal-self-authenticating", "sql"]
sql = ["icydb/sql"]

[dependencies]
canic-icydb = { workspace = true }
ic-platform = { workspace = true, features = ["runtime"] }
icydb = { workspace = true }
icydb-testing-audit-one-simple-fixtures = { workspace = true }
icydb-testing-canic-adapter = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }
serde = { workspace = true }

[build-dependencies]
icydb = { workspace = true }
icydb-testing-audit-one-simple-fixtures = { workspace = true }

[lints]
workspace = true
