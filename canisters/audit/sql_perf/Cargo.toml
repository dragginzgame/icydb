[package]
name = "canister_audit_sql_perf"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["serde"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
sql = ["icydb/sql"]
test-admin-api = ["sql"]

[dependencies]
canic-icydb = { workspace = true }
ic-cdk = { workspace = true }
ic-timers = { workspace = true }
icydb = { workspace = true }
icydb-testing-audit-sql-perf-fixtures = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
icydb = { workspace = true }
icydb-testing-audit-sql-perf-fixtures = { workspace = true }

[lints]
workspace = true
