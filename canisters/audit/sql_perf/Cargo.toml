[package]
workspace = "../../../testing/canic-adapter"
name = "canister_audit_sql_perf"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["serde", "toko-tooling"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
sql = ["icydb/sql"]
test-admin-api = ["sql"]

[dependencies]
canic-icydb = { workspace = true }
ic-platform = { workspace = true, features = ["ic0"] }
ic-timers = { workspace = true }
icydb = { workspace = true }
icydb-testing-audit-sql-perf-fixtures = { workspace = true }
icydb-testing-canic-adapter = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[build-dependencies]
icydb = { workspace = true, features = ["build"] }
icydb-testing-audit-sql-perf-fixtures = { workspace = true, features = ["build"] }

[lints]
workspace = true

[package.metadata.toko-tooling.loc]
category = "tests"

[target.'cfg(any())'.dev-dependencies]
toko-tooling.workspace = true
