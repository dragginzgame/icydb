[package]
name = "canister_audit_one_entity_typed_query"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["icydb-testing-audit-one-simple-fixtures"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
exact-key-measurement = []
typed-explain-measurement = []
sql-explain-measurement = ["sql"]
sql = ["icydb/sql"]
lifecycle-audit = []
lifecycle-participant = []
u256-audit = ["icydb-testing-audit-one-simple-fixtures/u256-audit"]

[dependencies]
canic-icydb = { workspace = true }
ic-platform = { workspace = true, features = ["ic0"] }
icydb = { workspace = true }
icydb-testing-audit-one-simple-fixtures = { workspace = true }
icydb-testing-wasm-helpers = { workspace = true }

[build-dependencies]
icydb = { workspace = true }
icydb-testing-audit-one-simple-fixtures = { workspace = true }

[lints]
workspace = true
