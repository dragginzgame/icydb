[package]
name = "canister_demo_rpg"
edition = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]
ignored = ["candid"]

[lib]
crate-type = ["cdylib"]

[features]
default = []
candid-export = []
sql = ["icydb/sql"]
local-sql-query = ["sql"]
test-admin-api = ["sql"]

[dependencies]
candid = { workspace = true }
ic-cdk = { workspace = true }
icydb = { workspace = true, features = ["metrics"] }
icydb-testing-demo-rpg-fixtures = { workspace = true }

[build-dependencies]
icydb = { workspace = true }
icydb-testing-demo-rpg-fixtures = { workspace = true }

[lints]
workspace = true
