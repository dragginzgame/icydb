[package]
name = "canister_demo_rpg"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
version = { workspace = true }
publish = false

[package.metadata.cargo-machete]

[lib]
crate-type = ["cdylib"]

[features]
default = []
sql = ["icydb/sql"]
local-sql-query = ["sql"]
test-admin-api = ["sql"]

[dependencies]
canic-icydb = { workspace = true }
icydb = { workspace = true, features = ["metrics"] }
icydb-testing-demo-rpg-fixtures = { workspace = true }

[build-dependencies]
icydb = { workspace = true }
icydb-testing-demo-rpg-fixtures = { workspace = true }

[lints]
workspace = true
